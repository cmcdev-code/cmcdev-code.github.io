<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9d1c1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <script>
    (function () {
      try {
        var stateKey = "siteWindowStateV1";
        var newWindowKey = "siteNewBrowserWindow";
        var state = JSON.parse(sessionStorage.getItem(stateKey) || "null") || {};
        if (sessionStorage.getItem(newWindowKey) === "true") {
          sessionStorage.removeItem(newWindowKey);
          state = { mode: "default", left: null, top: null };
          sessionStorage.setItem(stateKey, JSON.stringify(state));
        }
        if (state.mode === "minimized") {
          state.mode = "default";
          sessionStorage.setItem(stateKey, JSON.stringify(state));
        }
        var modes = ["default", "closed", "maximized"];
        var mode = modes.indexOf(state.mode) === -1 ? "default" : state.mode;
        var compactWindow = window.matchMedia && window.matchMedia("(max-width: 760px)").matches;
        document.documentElement.setAttribute("data-window-mode", mode);
        if (!compactWindow && mode === "default" && typeof state.left === "number" && typeof state.top === "number") {
          document.documentElement.setAttribute("data-window-positioned", "true");
          document.documentElement.style.setProperty("--boot-window-left", state.left + "px");
          document.documentElement.style.setProperty("--boot-window-top", state.top + "px");
        }
      } catch (error) {
        document.documentElement.setAttribute("data-window-mode", "default");
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ "/assets/style.css" | relative_url }}?v=20260810-2">
  {% if page.layout == "post" %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  {% endif %}
</head>
<body>
  <canvas id="gol" aria-hidden="true"></canvas>

  <div id="container" class="site-shell">
    <header class="window-bar">
      <div class="window-controls" aria-label="Window controls">
        <button class="window-control window-close" type="button" data-window-action="close" aria-label="Close window" title="Close window"></button>
        <button class="window-control window-maximize" type="button" data-window-action="maximize" aria-label="Maximize window" aria-pressed="false" title="Maximize window"></button>
      </div>
    </header>

    <div class="workspace">
      <aside id="sidebar" aria-label="Site navigation">
        <div class="sidebar-photo">
          <img id="random-headshot" src="{{ "/assets/headshots-web/IMG_1155.jpg" | relative_url }}" width="450" height="600" decoding="async" alt="Portrait of Collin McDevitt">
        </div>

        <nav class="site-nav">
          <a class="sidebar-link" href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>home</a>
          <a class="sidebar-link" href="{{ "/papers/" | relative_url }}"{% if page.url contains "/papers/" %} aria-current="page"{% endif %}>papers</a>
          <a class="sidebar-link" href="{{ "/contact/" | relative_url }}"{% if page.url contains "/contact/" %} aria-current="page"{% endif %}>contact</a>
          <a class="sidebar-link" href="{{ "/blog/" | relative_url }}"{% if page.url contains "/blog/" or page.layout == "post" %} aria-current="page"{% endif %}>blog</a>
          <a class="sidebar-link" href="{{ "/pics/" | relative_url }}"{% if page.url contains "/pics/" %} aria-current="page"{% endif %}>pics</a>
        </nav>
      </aside>

      <main id="main">
        {{ content }}
      </main>
    </div>

  </div>
  <div class="desktop-launchers" role="group" aria-label="Desktop applications">
    <button class="desktop-launcher browser-launcher" id="browser-launcher" type="button" aria-label="Open browser" title="Double-click to open browser">
      <span class="internet-browser-icon" aria-hidden="true">
        <span class="internet-globe-lines"></span>
      </span>
      <span class="desktop-launcher-label">internet</span>
    </button>

    <button class="desktop-launcher dtree-launcher" id="dtree-launcher" type="button" data-href="{{ "/dtree/" | relative_url }}" aria-label="Open d-tree lab" title="Double-click to open d-tree lab">
      <span class="dtree-app-icon" aria-hidden="true">
        <i class="dtree-app-edge dtree-app-edge-1"></i>
        <i class="dtree-app-edge dtree-app-edge-2"></i>
        <i class="dtree-app-edge dtree-app-edge-3"></i>
        <i class="dtree-app-edge dtree-app-edge-4"></i>
        <i class="dtree-app-edge dtree-app-edge-5"></i>
        <i class="dtree-app-edge dtree-app-edge-6"></i>
        <i class="dtree-app-node dtree-app-node-1"></i>
        <i class="dtree-app-node dtree-app-node-2"></i>
        <i class="dtree-app-node dtree-app-node-3"></i>
        <i class="dtree-app-node dtree-app-node-4"></i>
        <i class="dtree-app-node dtree-app-node-5"></i>
        <i class="dtree-app-node dtree-app-node-6"></i>
        <i class="dtree-app-node dtree-app-node-7"></i>
      </span>
      <span class="desktop-launcher-label">d-tree lab</span>
    </button>
  </div>

  <script>
    window.siteHeadshots = [
    {% assign first = true %}
    {% for f in site.static_files %}
      {% if f.path contains '/assets/headshots-web/' %}
        {% assign ext = f.extname | downcase %}
        {% if ext == '.jpg' or ext == '.jpeg' or ext == '.png' %}
          {% unless first %},{% endunless %}"{{ f.path | relative_url }}"
          {% assign first = false %}
        {% endif %}
      {% endif %}
    {% endfor %}
    ];
  </script>
  <script src="{{ "/assets/site.js" | relative_url }}?v=20260810-2"></script>
  {% if page.dtree_lab %}
  <script src="{{ "/assets/dtree.js" | relative_url }}?v=20260810-2"></script>
  {% endif %}
</body>
</html>
